name: Deploy Frontend to S3

on:
  workflow_dispatch:

concurrency:
  group: frontend-deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_APP_NAME: billingrse
  VITE_BACKEND_API_URL: https://api.dev.shrimptail.net/api/v1

jobs:
  test:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate build settings
        run: |
          if [ -z "${VITE_BACKEND_API_URL}" ]; then
            echo "VITE_BACKEND_API_URL is not set."
            exit 1
          fi
          if [[ "${VITE_BACKEND_API_URL}" != https://* ]]; then
            echo "VITE_BACKEND_API_URL must start with https:// (got: ${VITE_BACKEND_API_URL})"
            exit 1
          fi
          if [[ "${VITE_BACKEND_API_URL}" == *localhost* ]] || [[ "${VITE_BACKEND_API_URL}" == *127.0.0.1* ]]; then
            echo "VITE_BACKEND_API_URL must not point to localhost (got: ${VITE_BACKEND_API_URL})"
            exit 1
          fi

      - name: Setup safe-chain
        run: |
          npm i -g @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: test
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_COMMENT: ${{ secrets.CLOUDFRONT_COMMENT }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Validate deployment settings
        run: |
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "Missing secret: AWS_ROLE_ARN"
            exit 1
          fi
          if [ -z "${S3_BUCKET}" ]; then
            echo "Missing S3 bucket name"
            exit 1
          fi
          if [ -z "${CLOUDFRONT_COMMENT}" ]; then
            echo "Missing CloudFront comment"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./dist "s3://${S3_BUCKET}" --delete

      - name: Resolve CloudFront domain name
        run: |
          domain="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${CLOUDFRONT_COMMENT}'].DomainName | [0]" --output text)"
          if [ -z "${domain}" ] || [ "${domain}" = "None" ]; then
            echo "Could not find CloudFront distribution DomainName for Comment=${CLOUDFRONT_COMMENT}"
            exit 1
          fi
          echo "CLOUDFRONT_DOMAIN_NAME=${domain}" >> "${GITHUB_ENV}"

      - name: Resolve CloudFront distribution ID
        run: |
          id="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${CLOUDFRONT_COMMENT}'].Id | [0]" --output text)"
          if [ -z "${id}" ] || [ "${id}" = "None" ]; then
            echo "Could not find CloudFront distribution ID for Comment=${CLOUDFRONT_COMMENT}"
            exit 1
          fi
          echo "CLOUDFRONT_DISTRIBUTION_ID=${id}" >> "${GITHUB_ENV}"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

      - name: Deployment summary
        run: |
          echo "S3: s3://${S3_BUCKET}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CloudFront: https://${CLOUDFRONT_DOMAIN_NAME}" >> "${GITHUB_STEP_SUMMARY}"
